{% set name = "nbbrowserpdf" %}
{% set version = "0.2.0" %}
{% set compress_type = "tar.gz" %}
{% set hash = "e21dbf822097a22060bcffeee380df7d56443ed2e433843093fa3d56f7584990" %}
{% set build = 3 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ compress_type }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ compress_type }}
  sha256: {{ hash }}

build:
  noarch: python
  entry_points:
      - nbbrowserpdf = nbbrowserpdf.export:main
  number: {{ build }}
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - pypdf2
    - ghost.py

test:
  requires:
    - python {{ python_min }}
  imports:
    - nbbrowserpdf

about:
  home: https://github.com/Anaconda-Server/nbbrowserpdf
  license_file: LICENSE
  license: BSD 3-Clause
  license_family: BSD
  summary: 'LaTeX-free PDF generation from Jupyter Notebooks'
  dev_url: https://github.com/Anaconda-Server/nbbrowserpdf

extra:
  recipe-maintainers:
    - pmlandwehr
